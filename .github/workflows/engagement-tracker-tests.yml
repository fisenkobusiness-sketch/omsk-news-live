name: Engagement tracker tests

on:
  push:
    branches:
      - main
      - smm-poiskovik-engagement-tracker
  pull_request:
    branches:
      - main
      - smm-poiskovik-engagement-tracker

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install requests
      - name: Compile news pipeline modules
        run: python -m py_compile src/live_monitor.py src/analysis.py src/predictor.py
      - name: Run tracker tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
