name: Engagement tracker tests

on:
  push:
    branches:
      - main
      - smm-poiskovik-engagement-tracker
      - refactor/single-entrypoint
  pull_request:
    branches:
      - main
      - smm-poiskovik-engagement-tracker

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install requests
      - name: Compile canonical modules and tools
        run: python -m py_compile run_smm_poiskovik.py src/live_monitor.py src/analysis.py src/predictor.py src/metrics.py src/editorial_rules.py src/smm_poiskovik_engagement_tracker.py tools/diagnostic.py tools/check_smm_poiskovik_connections.py
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
